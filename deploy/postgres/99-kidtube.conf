# Install as /etc/postgresql/<major>/main/conf.d/99-kidtube.conf, then: sudo systemctl restart postgresql
# (<major> is 16 for the Ubuntu 24.04 package; `pg_lsclusters` shows it, also for PGDG packages.)

# Listen on the loopback interface only (this is also the Ubuntu default; stated here so it cannot drift).
listen_addresses = 'localhost'
# Store and negotiate passwords as SCRAM (default since PostgreSQL 14).
password_encryption = scram-sha-256
