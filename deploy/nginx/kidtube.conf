# /etc/nginx/sites-available/kidtube  ->  symlink into sites-enabled/   (Ubuntu 24.04: nginx 1.24; needs >= 1.19.4)
#
# Replace api.example.com (3 places below) with your domain.
# Certificates: obtain them FIRST (DEPLOY.md step "nginx and certbot"); nginx -t fails while the files are missing.
#
# This file is included inside nginx's http{} block, which is why limit_req_zone and server_tokens may appear here.
# Do NOT add add_header inside a location{}: any add_header in a location silently drops every add_header from the
# server{} level, including the security headers below.

server_tokens off;

# ---- defense-in-depth rate limits (per client IP) -------------------------------------------------------------
# The app already locks out repeated FAILED logins / pairing guesses (5 per 10 minutes). These are far looser and only
# stop floods. A family behind one NAT address with several phones refreshing tokens stays well under them.
limit_req_zone $binary_remote_addr zone=kidtube_auth:10m rate=60r/m;   # /auth/*   (login, refresh, register)
limit_req_zone $binary_remote_addr zone=kidtube_pair:10m rate=30r/m;   # /devices/pair
limit_req_status 429;
limit_conn_status 429;
limit_conn_zone $binary_remote_addr zone=kidtube_conn:10m;

# ---- 1. catch-all: unknown Host names get nothing (scanners hitting the bare IP) ------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;      # no certificate is revealed to clients that do not ask for our domain
    return 444;
}

# ---- 2. HTTP: redirect everything to HTTPS (except the certbot challenge) ---------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # certbot --webroot renewals write their challenge files here (see DEPLOY.md)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        return 301 https://api.example.com$request_uri;
    }
}

# ---- 3. HTTPS: the API -----------------------------------------------------------------------------------------
server {
    # nginx 1.24 (Ubuntu 24.04) takes http2 on the listen line; the separate `http2 on;` directive needs nginx >= 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # Managed by certbot (certonly): files appear after `certbot certonly`, renewed in place by certbot.timer.
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:kidtube_tls:10m;
    ssl_session_tickets off;

    # ---- security headers (server level only, see the note at the top) ----
    # Enable HSTS ONLY after tests/smoke_test.sh passes over HTTPS: browsers remember it for a year.
    # Then remove the leading # on the next line and run: sudo nginx -t && sudo systemctl reload nginx
    #add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # (No Cache-Control here: the app sets its own, e.g. `private, no-cache` + ETag on /sync/pull.)

    # Requests are small JSON (largest: a /sync/push of 200 events, well under 100 KB).
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn kidtube_conn 40;

    # ---- proxy defaults (inherited by the locations below) ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # OVERWRITE, never append: $remote_addr is the real peer of THIS connection. The app takes the last entry of
    # X-Forwarded-For, and with $proxy_add_x_forwarded_for a client could prepend fake addresses.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The app builds absolute redirect URLs (e.g. a trailing-slash redirect) from the scheme it sees (http).
    proxy_redirect http://$host/ https://$host/;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # ---- rate-limited endpoints ----
    # Matching order: `= exact` first, then the longest plain prefix, then regex locations (first match wins and
    # overrides the prefix). The regex block further down names other paths only, so it never captures /auth/ or /sync/.
    location /auth/ {
        limit_req zone=kidtube_auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /devices/pair {
        limit_req zone=kidtube_pair burst=15 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # POST /sync/push verifies up to 50 new YouTube links (5 s timeout each) before it answers.
    location /sync/ {
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8000;
    }

    # ---- only the paths the app really has. Everything else (/docs, /redoc, /openapi.json, probes) is a 404 here ----
    # /auth/ and /sync/ are handled above. Routes: see `app.openapi()["paths"]`.
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/(children|videos|plan-items|events|devices|reports)(/|$) {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        return 404;
    }
}
