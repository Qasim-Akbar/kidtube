# /etc/nginx/sites-available/kidtube.conf  ->  symlink in /etc/nginx/sites-enabled/   (rendered by deploy/install.sh)
# Standalone server blocks for ONE host name: @KIDTUBE_DOMAIN@. Proxies to 127.0.0.1:@KIDTUBE_PORT@.
#
# Rules this file follows so it cannot disturb the other sites on the machine:
#   * no default_server, no `server_name _`, no catch-all; only @KIDTUBE_DOMAIN@ is ever answered by these blocks;
#   * no http-level settings except uniquely named kidtube_* rate-limit zones (needed in http context; sites-enabled is
#     included there), server_tokens only per server block, no ssl_protocols/ciphers/http2 (those are shared per listen socket);
#   * nothing outside /var/log/nginx/kidtube.*.log is written.
# Do NOT add add_header inside a location{}: it silently drops every server-level add_header (the security headers).
# New top-level API routes must be added to the regex location near the bottom.

# ---- rate limits (per client IP), defense in depth ---------------------------------------------------------------
# The app locks out repeated FAILED logins / pairing guesses (5 per 10 minutes); these only stop floods.
limit_req_zone $binary_remote_addr zone=kidtube_auth:10m rate=60r/m;   # /auth/*
limit_req_zone $binary_remote_addr zone=kidtube_pair:10m rate=30r/m;   # /devices/pair
limit_conn_zone $binary_remote_addr zone=kidtube_conn:10m;

# ---- HTTP: redirect to HTTPS, keep the certbot challenge path -----------------------------------------------------
server {
    listen 80;
    @NGINX_LISTEN_80_V6@
    server_name @KIDTUBE_DOMAIN@;
    server_tokens off;   # per-server setting: affects only this host name

    access_log /var/log/nginx/kidtube.access.log;
    error_log  /var/log/nginx/kidtube.error.log;

    location /.well-known/acme-challenge/ {
        root @KIDTUBE_WEBROOT@;
        default_type text/plain;
    }
    location / {
        return 301 https://@KIDTUBE_DOMAIN@$request_uri;
    }
}

# ---- HTTPS: the API ---------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    @NGINX_LISTEN_443_V6@
    server_name @KIDTUBE_DOMAIN@;
    server_tokens off;   # per-server setting: affects only this host name

    ssl_certificate     /etc/letsencrypt/live/@KIDTUBE_DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@KIDTUBE_DOMAIN@/privkey.pem;
    # TLS versions, ciphers and session settings are inherited from nginx.conf (shared with the other sites).

    access_log /var/log/nginx/kidtube.access.log;
    error_log  /var/log/nginx/kidtube.error.log;

    # ---- security headers (server level only) ----
    # Optional HSTS: enable only after deploy/smoke_test.sh passes; browsers remember it for a year. No includeSubDomains
    # (other sites live on sibling names).
    #add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # (No Cache-Control here: the app sets its own, e.g. `private, no-cache` + ETag on /sync/pull.)

    # Requests are small JSON (largest: a /sync/push of 200 events, well under 100 KB).
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_conn kidtube_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    # ---- proxy defaults (inherited by the locations below) ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # OVERWRITE, never append: $remote_addr is the real peer. The app (TRUST_PROXY_HEADERS=true) takes the LAST
    # X-Forwarded-For entry; with $proxy_add_x_forwarded_for a client could prepend fake addresses.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect http://$host/ https://$host/;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location /auth/ {
        limit_req zone=kidtube_auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:@KIDTUBE_PORT@;
    }
    location = /devices/pair {
        limit_req zone=kidtube_pair burst=15 nodelay;
        proxy_pass http://127.0.0.1:@KIDTUBE_PORT@;
    }
    # POST /sync/push verifies up to 50 new YouTube links (5 s timeout each) before it answers.
    location /sync/ {
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:@KIDTUBE_PORT@;
    }

    # Only the paths the app has; everything else (/docs, /redoc, /openapi.json, probes) is a 404 here.
    # /auth/ and /sync/ are handled above.
    location = /health {
        proxy_pass http://127.0.0.1:@KIDTUBE_PORT@;
    }
    location ~ ^/(children|videos|plan-items|events|devices|reports)(/|$) {
        proxy_pass http://127.0.0.1:@KIDTUBE_PORT@;
    }
    location / {
        return 404;
    }
}
