# Step 1 of 2 (install.sh renders this to /etc/nginx/sites-available/kidtube.conf). HTTP only, one host name.
# It exists so certbot can prove control of @KIDTUBE_DOMAIN@ BEFORE any certificate exists (the final file refers
# to certificate files, so `nginx -t` would fail without them). Replaced by kidtube.conf once the certificate is issued.
# No default_server, no other site is touched.

server {
    listen 80;
    @NGINX_LISTEN_80_V6@
    server_name @KIDTUBE_DOMAIN@;
    server_tokens off;   # per-server setting: affects only this host name

    access_log /var/log/nginx/kidtube.access.log;
    error_log  /var/log/nginx/kidtube.error.log;

    location /.well-known/acme-challenge/ {
        root @KIDTUBE_WEBROOT@;
        default_type text/plain;
    }
    location / {
        return 404;
    }
}
