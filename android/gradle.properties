org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Base URL baked into RELEASE builds (the backend on the VPS, https only, e.g. https://kidtube.example.com/).
# Do not commit the real value. Set it in ~/.gradle/gradle.properties or pass -PKIDTUBE_API_BASE_URL=...
# Release builds fail while this is missing or still CHANGE-ME. Debug builds ignore it.
KIDTUBE_API_BASE_URL=CHANGE-ME
