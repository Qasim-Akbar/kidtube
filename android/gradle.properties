org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Base URL baked into RELEASE builds (the backend on the VPS, https only, e.g. https://kidtube.example.com/).
# Do not commit the real value. Easiest: KIDTUBE_DOMAIN=your.domain (bare host, in ~/.gradle/gradle.properties or
# -PKIDTUBE_DOMAIN=...) which becomes https://your.domain/. A real KIDTUBE_API_BASE_URL overrides it.
# Release builds fail while this is missing or still CHANGE-ME. Debug builds ignore it.
KIDTUBE_API_BASE_URL=CHANGE-ME

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
